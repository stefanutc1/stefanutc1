  <text x="14" y="328" fill="#827470" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">+</text>
  <text x="1176" y="328" fill="#827470" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">+</text>

