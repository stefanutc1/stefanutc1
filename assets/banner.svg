<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="1200" y1="0" x2="0" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c0c0c"/>
      <stop offset="55%" stop-color="#14090d"/>
      <stop offset="100%" stop-color="#17090d"/>
    </linearGradient>
    <radialGradient id="orbLeft" cx="18%" cy="20%" r="45%">
